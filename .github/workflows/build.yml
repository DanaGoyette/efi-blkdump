name: Build EFI applications

on:
  push:
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Check out project
        uses: actions/checkout@v7

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            ca-certificates \
            git \
            uuid-dev \
            nasm \
            acpica-tools \
            python3 \
            python3-venv \
            gcc-aarch64-linux-gnu \
            binutils-aarch64-linux-gnu

      - name: Set up pinned EDK II checkout
        env:
          EDK2_REF: ea0ca89f7bd9b3f25481d6ab87f17808b0fd64fa
        run: |
          git init edk2
          git -C edk2 remote add origin https://github.com/tianocore/edk2.git
          git -C edk2 fetch --depth 1 origin "$EDK2_REF"
          git -C edk2 checkout --detach FETCH_HEAD
          git -C edk2 submodule update --init --depth 1 -- \
            BaseTools/Source/C/BrotliCompress/brotli \
            MdeModulePkg/Library/BrotliCustomDecompressLib/brotli \
            MdePkg/Library/MipiSysTLib/mipisyst

      - name: Install EDK II Python requirements
        run: |
          python3 -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install -r edk2/pip-requirements.txt

      - name: Build release binaries for all architectures
        run: PATH="$GITHUB_WORKSPACE/.venv/bin:$PATH" ./build.sh ALL

      - name: Upload X64 release EFI
        uses: actions/upload-artifact@v7
        with:
          path: Artifacts/BlkDump-x64.efi
          archive: false
          if-no-files-found: error
          retention-days: 7

      - name: Upload AARCH64 release EFI
        uses: actions/upload-artifact@v7
        with:
          path: Artifacts/BlkDump-aarch64.efi
          archive: false
          if-no-files-found: error
          retention-days: 7

      - name: Upload assets to GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "$GITHUB_REF_NAME" \
            Artifacts/BlkDump-x64.efi#BlkDump-x64.efi \
            Artifacts/BlkDump-aarch64.efi#BlkDump-aarch64.efi \
            --clobber
